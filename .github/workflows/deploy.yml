name: "Re-deploy DeployHistory"
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false

      - name: Snapshot old WindowsStudio64 version history
        run: |
          FILE="version-history-inverted/Windows/Studio64.json"
          if [ -f "$FILE" ]; then
            cp "$FILE" /tmp/Studio64.old.json
          else
            echo '{}' > /tmp/Studio64.old.json
          fi

      - name: Run DeployHistory Parser
        run: python scripts/deployhistory.py

      - name: Dispatch missing LIVE/zbeta versions for ReflectionService dump
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          DUMP_BASE="https://raw.githubusercontent.com/setup-rbxcdn/roblox-full-api-dumps/main/reflectionservice-dumps"
          CANDIDATES="[]"

          # The Open Cloud engine behind the Luau task can sit on the zbeta build
          # instead of LIVE, so hand both channels to the dump workflow and let its
          # own version() decide which candidate is the one worth dumping.
          for CHANNEL in "" "/channel/zbeta"; do
            LABEL="${CHANNEL:-live}"

            if ! RESP=$(curl --fail --silent --show-error \
              "https://clientsettingscdn.roblox.com/v2/client-version/WindowsStudio64${CHANNEL}"); then
              echo "${LABEL} is offline; skipping."
              continue
            fi

            if ! HASH=$(echo "$RESP" | jq -er '.clientVersionUpload | select(type == "string" and length > 0)') || \
               ! ENGINE_VERSION=$(echo "$RESP" | jq -er '.version | select(type == "string" and length > 0)'); then
              echo "${LABEL} returned no usable version; skipping."
              continue
            fi

            # A HEAD against the raw CDN costs no API quota, unlike a dispatch.
            if curl --fail --silent --show-error --head --location \
              "${DUMP_BASE}/${HASH}-ReflectionService-Dump.json" > /dev/null; then
              echo "${LABEL} ${HASH} (${ENGINE_VERSION}) already has a dump; skipping."
              continue
            fi

            echo "${LABEL} ${HASH} (${ENGINE_VERSION}) is missing its dump; queueing."
            CANDIDATES=$(echo "$CANDIDATES" | jq -c \
              --arg version "$HASH" \
              --arg engine_version "$ENGINE_VERSION" \
              '. + [{version: $version, engine_version: $engine_version}]')
          done

          if [ "$(echo "$CANDIDATES" | jq 'length')" -eq 0 ]; then
            echo "No ReflectionService dump is missing; no dispatch sent."
            exit 0
          fi

          echo "Dispatching one reflection-service run for $(echo "$CANDIDATES" | jq -c 'map(.version)')"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/setup-rbxcdn/roblox-full-api-dumps/actions/workflows/reflection-service.yml/dispatches \
            -d "$(jq -nc --arg versions "$CANDIDATES" '{ref:"main",inputs:{versions:$versions}}')"

      - name: Commit changes
        run: |
          git config user.email "bot@local"
          git config user.name "bot"
          git add .
          git diff --cached --quiet || (
            git commit -m "Update version history" -m "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          )

      - name: Dispatch new WindowsStudio64 versions
        run: |
          FILE="version-history-inverted/Windows/Studio64.json"

          OLD_HASHES=$(jq -r 'keys[]' /tmp/Studio64.old.json 2>/dev/null || true)
          NEW_HASHES=$(jq -r 'keys[]' "$FILE" 2>/dev/null || true)

          DIFF=$(comm -13 <(echo "$OLD_HASHES" | sort) <(echo "$NEW_HASHES" | sort))

          if [ -z "$DIFF" ]; then
            echo "No new WindowsStudio64 versions discovered this run."
            exit 0
          fi

          for HASH in $DIFF; do
            echo "Dispatching for $HASH to build-archive"
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/repos/setup-rbxcdn/build-archive/actions/workflows/update.yml/dispatches \
              -d '{"ref":"master"}'

            echo "Dispatching for $HASH to roblox-full-api-dumps"
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              https://api.github.com/repos/setup-rbxcdn/roblox-full-api-dumps/actions/workflows/full.yml/dispatches \
              -d '{"ref":"main","inputs":{"version":"'"$HASH"'"}}'
          done
